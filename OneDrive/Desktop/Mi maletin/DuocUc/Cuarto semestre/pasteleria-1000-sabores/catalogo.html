<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastelería 1000 Sabores — Catálogo</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="assets/styles.css" />

</head>
<body>
  <!-- HEADER -->
  <header class="site-header shadow-sm">
    <div class="container header-inner d-flex justify-content-between align-items-center py-3">
      <a class="brand fs-3 text-decoration-none" href="index.html">
        Pastelería <span class="text-accent">1000 Sabores</span>
      </a>
      <nav class="site-nav d-flex gap-3" aria-label="Principal">
        <a href="index.html" class=" btn btn-outline">Inicio</a>
        <a href="catalogo.html" class="active btn btn-accent">Catálogo</a>
        <a href="registro.html" class="btn btn-outline">Registro</a>
        <a href="carrito.html" class="btn btn-outline">Carrito</a>
      </nav>
    </div>
  </header>
  <!-- MAIN -->
  <main class="container my-5">
    <h1 class="display-5 text-center mb-4">Catálogo de productos</h1>

    <!-- FILTROS -->
    <form id="filtros" class="filters" aria-label="Filtros de catálogo">
      <label>
        Categoría
        <select name="categoria" class="form-select">
          <option value="">Todas</option>
          <option value="Tortas Cuadradas">Tortas Cuadradas</option>
          <option value="Tortas Circulares">Tortas Circulares</option>
          <option value="Postres Individuales">Postres Individuales</option>
          <option value="Productos Sin Azúcar">Productos Sin Azúcar</option>
          <option value="Pastelería Tradicional">Pastelería Tradicional</option>
          <option value="Productos Sin Gluten">Productos Sin Gluten</option>
          <option value="Productos Vegana">Productos Vegana</option>
          <option value="Tortas Especiales">Tortas Especiales</option>
        </select>
      </label>
      <label>
        Forma
        <select name="forma" class="form-select">
          <option value="">Todas</option>
          <option value="cuadrada">Cuadrada</option>
          <option value="circular">Circular</option>
        </select>
      </label>
      <label>
        Tamaño
        <select name="tamano" class="form-select">
          <option value="">Todos</option>
          <option value="pequena">Pequeña</option>
          <option value="mediana">Mediana</option>
          <option value="grande">Grande</option>
        </select>
      </label>
      <label class="search">
        Buscar
        <input type="search" name="q" class="form-control" placeholder="Nombre o código..." />
      </label>
    </form>

    <!-- LISTADO DE PRODUCTOS -->
    <div id="listado" class="row g-4" aria-live="polite">
      <!-- Ejemplos de productos -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="product">
          <div class="thumb">🍰</div>
          <h3 class="h5">Torta de Chocolate</h3>
          <p class="price">$15.000</p>
          <button class="btn btn-accent mt-2">Agregar al carrito</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="product">
          <div class="thumb">🍓</div>
          <h3 class="h5">Cheesecake de Frutilla</h3>
          <p class="price">$12.000</p>
          <button class="btn btn-accent mt-2">Agregar al carrito</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="product">
          <div class="thumb">🥭</div>
          <h3 class="h5">Tarta de Mango</h3>
          <p class="price">$13.500</p>
          <button class="btn btn-accent mt-2">Agregar al carrito</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="product">
          <div class="thumb">🍋</div>
          <h3 class="h5">Pie de Limón</h3>
          <p class="price">$11.000</p>
          <button class="btn btn-accent mt-2">Agregar al carrito</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container text-center">
      <small>&copy; 2025 Pastelería 1000 Sabores</small>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
