version: '3.8'
services:
  pricing:
    build:
      context: .  # ← si Dockerfile está en la misma carpeta
    ports:
      - "8084:8080"
    volumes:
      - ./Wallet_Fullstack:/app/wallet  # ← asegúrate que exista esta carpeta
    environment:
      - SPRING_APPLICATION_NAME=Pricing
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@fullstack_high?TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_USERNAME=ADMIN
      - SPRING_DATASOURCE_PASSWORD=FullStack-001
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.OracleDialect
    networks:
      - backend

networks:
  backend:
    driver: bridge

